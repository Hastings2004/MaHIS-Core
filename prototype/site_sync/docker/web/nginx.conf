# Serves the built MaHIS web app. Unknown paths fall back to index.html so
# the app's own routes survive a page refresh.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Each hospital's own settings (which API to use), mounted outside the
  # shared, read-only web app folder.
  location = /config.json {
    alias /etc/mahis/config.json;
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
