# TLS-terminating, mutual-TLS-verifying reverse proxy for the site -> central
# sync traffic only (the admin dashboard keeps using central-api's own plain
# port; this is purely for the wan-facing sync endpoints). See ../README.md
# "Mutual TLS" for how this fits into docker-compose.yml.
server {
    listen 8443 ssl;
    server_name central-tls;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_client_certificate /etc/nginx/tls/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 1;

    location / {
        proxy_pass http://central-api:3000;
        proxy_set_header Host $host;
        # Only reachable here because nginx has already verified the chain
        # above -- base_controller.rb trusts this header because nothing but
        # this proxy can set it once central-api is no longer reachable
        # directly from the wan network.
        proxy_set_header X-Site-Code-Verified $ssl_client_s_dn_cn;
    }
}
